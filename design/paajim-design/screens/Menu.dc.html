<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

const live = { priceColor: '#C1121F', btn: '#C1121F', tag: '[Photo]' };
const out = { priceColor: '#5B5B5B', btn: '#B9B2AE', bg: '#EFEAE6', tag: 'Sold out', price: 'Sold out today' };

Popular: [
{ ...live, name: 'Jollof & Chicken', desc: 'Smoky party jollof, grilled chicken, coleslaw and shito', price: 'GH₵ 55.00', bg: '#F9DCCB' },
{ ...live, name: 'Assorted Fried Rice', desc: 'Chicken, beef, sausage and boiled egg', price: 'GH₵ 70.00', bg: '#F6E5C2' },

{ ...out, name: 'Malt · glass bottle', desc: 'Chilled, 330ml' }

{ ...live, name: 'Fried Rice & Beef', desc: 'Stewed beef, coleslaw and shito', price: 'GH₵ 50.00', bg: '#F3E1C0' },

{ ...out, name: 'Malt · glass bottle', desc: 'Chilled, 330ml' }
]
};
return { tabs, items: menu[cur] };
}
}
</script>
