<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paa Jim · Cart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#C1121F}a:hover{color:#8E0D17}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 52px 20px 0; display: flex; align-items: center; gap: 14px">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #F7F4F2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; flex: 1; font-size: 22px; font-weight: 800">Your order</h1>
<button style="height: 36px; border: 0; background: transparent; font-family: inherit; font-size: 13px; font-weight: 700; color: #C1121F">Clear</button>
</div>
<div style="margin: 16px 20px 0; padding: 12px 14px; border-radius: 14px; background: #E8F5EC; color: #146C2E; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#146C2E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Kitchen is open — ready in about 25 min</div>
<div style="padding: 10px 20px 0; display: flex; flex-direction: column">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0EBE8">
<span style="width: 72px; height: 72px; border-radius: 16px; background: {{l.bg}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #5B3A2A">[Photo]</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{l.name}}</span>
<span style="font-size: 12px; color: #5B5B5B">{{l.note}}</span>
<span style="font-size: 15px; font-weight: 800; color: #C1121F">GH₵ {{l.lineTotal}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; background: #F7F4F2; border-radius: 12px; padding: 4px">
<button aria-label="Increase" onClick="{{l.inc}}" style="width: 32px; height: 32px; border: 0; border-radius: 9px; background: #C1121F; color: #FFFFFF; font-size: 16px; font-weight: 700">+</button>
<span style="font-size: 14px; font-weight: 800">{{l.qty}}</span>
<button aria-label="Decrease" onClick="{{l.dec}}" style="width: 32px; height: 32px; border: 0; border-radius: 9px; background: #FFFFFF; color: #1A1A1A; font-size: 16px; font-weight: 700">−</button>
</div>
</div>
</sc-for>
</div>
<h2 style="margin: 18px 20px 10px; font-size: 16px; font-weight: 800">Add a cold drink</h2>
<div style="padding: 0 20px; display: flex; gap: 10px">
<sc-for list="{{recs}}" as="r" hint-placeholder-count="3">
<div style="flex: 1; border-radius: 16px; border: 1px solid #ECE7E4; overflow: hidden; display: flex; flex-direction: column">
<span style="height: 66px; background: {{r.bg}}; position: relative"><button aria-label="Add" style="position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border: 0; border-radius: 9px; background: #C1121F; color: #FFFFFF; font-size: 16px; font-weight: 700">+</button></span>
<span style="padding: 8px 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; font-weight: 700; color: #C1121F">{{r.price}}</span></span>
</div>
</sc-for>
</div>
<div style="margin-top: auto; padding: 16px 20px 32px; border-top: 1px solid #ECE7E4; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5B5B5B"><span>Subtotal</span><span style="font-weight: 700; color: #1A1A1A">GH₵ {{subtotal}}</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5B5B5B"><span>Delivery fee</span><span>Calculated at checkout</span></div>
<a href="Checkout.dc.html" style="height: 56px; border-radius: 16px; background: #C1121F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Go to checkout</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { q: [1, 1, 1] }; }
renderVals() {
const base = [
{ name: 'Jollof & Chicken', note: 'Extra shito', unit: 55, bg: '#F9DCCB' },
{ name: 'Assorted Fried Rice', note: 'Chicken, beef, sausage, egg', unit: 70, bg: '#F6E5C2' },
{ name: 'Soft drink · can', note: 'Cola · chilled', unit: 10, bg: '#F3D0DA' }
];
const q = this.state.q;
const set = (i, d) => { const n = q.slice(); n[i] = Math.max(0, n[i] + d); this.setState({ q: n }); };
const lines = base.map((b, i) => ({ ...b, qty: q[i], lineTotal: (b.unit * q[i]).toFixed(2), inc: () => set(i, 1), dec: () => set(i, -1) }));
const subtotal = base.reduce((s, b, i) => s + b.unit * q[i], 0).toFixed(2);
return {
lines, subtotal,
recs: [
{ name: 'Water 500ml', price: 'GH₵ 5', bg: '#DCEBF5' },
{ name: 'Glass bottle', price: 'GH₵ 8', bg: '#E3EAD5' },
{ name: 'Water 1.5L', price: 'GH₵ 10', bg: '#CFE3F0' }
]
};
}
}
</script>
</body>
</html>
