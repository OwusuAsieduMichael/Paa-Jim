<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paa Jim Rider · Claim order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#C1121F}a:hover{color:#8E0D17}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; overflow: hidden; display: flex; flex-direction: column">
<div style="background: #C1121F; color: #FFFFFF; padding: 52px 20px 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #C1121F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">KA</span>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; opacity: 0.85">Rider</span><span style="font-size: 17px; font-weight: 800">Kwame Asante</span></div>
<span style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.2); display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7CE39A"></span>On shift</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.14); display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800">6</span><span style="font-size: 11px; opacity: 0.9">Deliveries today</span></div>
<div style="padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.14); display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800">1</span><span style="font-size: 11px; opacity: 0.9">Waiting at kitchen</span></div>
</div>
</div>
<div style="padding: 26px 24px 0; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Claim an order</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B5B5B">Enter the 6-digit Pickup ID the kitchen reads out to you.</p>
</div>
<div style="padding: 22px 24px 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
<span style="height: 58px; border-radius: 14px; background: {{d.bg}}; border: {{d.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800">{{d.v}}</span>
</sc-for>
</div>
<p style="margin: 12px 24px 0; font-size: 12px; color: #5B5B5B">5 wrong tries locks claiming for 10 minutes.</p>
<div style="padding: 20px 24px 0">
<a href="RiderDelivery.dc.html" style="height: 56px; border-radius: 16px; background: #C1121F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-7h5l3 7M10 10 8 6H5"/></svg>Claim &amp; start delivery</a>
</div>
<div style="margin-top: auto; background: #F2EEEC; padding: 10px 8px 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button aria-label="{{k.label}}" onClick="{{k.press}}" style="height: 50px; border: 0; border-radius: 10px; background: {{k.bg}}; font-family: inherit; font-size: 22px; font-weight: 600; color: #1A1A1A">{{k.text}}</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { code: '2846' }; }
renderVals() {
const code = this.state.code;
const digits = [0, 1, 2, 3, 4, 5].map((i) => ({
v: code[i] || '',
bg: code[i] ? '#F7F4F2' : '#FFFFFF',
border: i === code.length ? '2px solid #C1121F' : (code[i] ? '0' : '1.5px solid #ECE7E4')
}));
const push = (c) => this.setState({ code: (code + c).slice(0, 6) });
const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map((t) => ({
text: t, label: t === '⌫' ? 'Delete' : (t || 'Blank'),
bg: t === '' || t === '⌫' ? 'transparent' : '#FFFFFF',
press: () => { if (t === '⌫') this.setState({ code: code.slice(0, -1) }); else if (t) push(t); }
}));
return { digits, keys };
}
}
</script>
</body>
</html>
