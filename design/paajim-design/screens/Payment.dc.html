<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paa Jim · Pay with mobile money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#C1121F}a:hover{color:#8E0D17}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 32px">
<div style="display: flex; align-items: center; gap: 14px">
<a href="Checkout.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #F7F4F2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Payment</h1>
</div>
<div style="margin-top: 20px; border-radius: 20px; background: #C1121F; color: #FFFFFF; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; opacity: 0.9">Amount to pay</span><span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em">GH₵ 150.00</span></div>
<span style="font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.2)">Order #PJ-1042</span>
</div>
<h2 style="margin: 24px 0 12px; font-size: 16px; font-weight: 800">Choose your network</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{nets}}" as="n" hint-placeholder-count="3">
<button onClick="{{n.pick}}" style="height: 68px; border-radius: 16px; border: {{n.border}}; background: {{n.bg}}; padding: 0 16px; display: flex; align-items: center; gap: 14px; font-family: inherit; text-align: left; color: #1A1A1A; box-sizing: border-box">
<span style="width: 40px; height: 40px; border-radius: 12px; background: {{n.badge}}; color: {{n.badgeText}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">{{n.mark}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{n.name}}</span><span style="font-size: 12px; color: #5B5B5B">{{n.sub}}</span></span>
<span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid {{n.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{n.dot}}"></span></span>
</button>
</sc-for>
</div>
<label for="momo" style="margin-top: 20px; font-size: 13px; font-weight: 700">Mobile money number</label>
<div style="margin-top: 8px; height: 54px; border-radius: 14px; border: 1.5px solid #ECE7E4; background: #F7F4F2; display: flex; align-items: center; padding: 0 16px; gap: 10px">
<span style="font-size: 15px; font-weight: 600; color: #5B5B5B">+233</span>
<input id="momo" type="tel" value="24 123 4567" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: inherit; font-size: 15px; font-weight: 700; color: #1A1A1A">
</div>
<div style="margin-top: 16px; padding: 14px; border-radius: 14px; background: #FFF6E0; display: flex; gap: 10px; font-size: 13px; line-height: 1.5; color: #5A4300">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6500" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
<span>{{hint}}</span>
</div>
<a href="OrderPlaced.dc.html" style="margin-top: auto; height: 56px; border-radius: 16px; background: #C1121F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Pay GH₵ 150.00</a>
<p style="margin: 12px 0 0; text-align: center; font-size: 12px; color: #5B5B5B">Secured by Paystack · Refunds go back to this wallet</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: 'mtn' }; }
renderVals() {
const all = [
{ id: 'mtn', name: 'MTN MoMo', sub: 'Approve with your MoMo PIN', mark: 'MTN', badge: '#FFCC00', badgeText: '#1A1A1A' },
{ id: 'vod', name: 'Telecel Cash', sub: 'You may get a one-time code by SMS', mark: 'TC', badge: '#1A1A1A', badgeText: '#FFFFFF' },
{ id: 'atl', name: 'AirtelTigo Money', sub: 'Approve with your PIN', mark: 'AT', badge: '#1F3C88', badgeText: '#FFFFFF' }
];
const sel = this.state.sel;
const nets = all.map((n) => {
const on = n.id === sel;
return { ...n, border: on ? '2px solid #C1121F' : '1.5px solid #ECE7E4', bg: on ? '#FFF7F7' : '#FFFFFF', ring: on ? '#C1121F' : '#CFC7C3', dot: on ? '#C1121F' : 'transparent', pick: () => this.setState({ sel: n.id }) };
});
const hint = sel === 'vod'
? 'After you tap Pay, enter the code Telecel texts you, then approve the prompt on your phone.'
: 'After you tap Pay, a prompt will pop up on your phone. Enter your PIN to approve — keep this screen open.';
return { nets, hint };
}
}
</script>
</body>
</html>
