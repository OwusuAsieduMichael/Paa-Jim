<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paa Jim · Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#C1121F}a:hover{color:#8E0D17}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 0">
<div style="display: flex; gap: 10px; align-items: center">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #F7F4F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<label for="q" style="flex: 1; height: 48px; border-radius: 14px; border: 1.5px solid #C1121F; display: flex; align-items: center; gap: 10px; padding: 0 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C1121F" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" value="rice" aria-label="Search the menu" style="flex: 1; min-width: 0; border: 0; outline: none; font-family: inherit; font-size: 15px; font-weight: 600; color: #1A1A1A; background: transparent"></label>
</div>
<h2 style="margin: 22px 0 10px; font-size: 15px; font-weight: 800">Recent</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: #F7F4F2; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5B5B5B" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{r}}</span>
</sc-for>
</div>
<h2 style="margin: 20px 0 10px; font-size: 15px; font-weight: 800">Try</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="8">
<span style="height: 32px; padding: 0 12px; border-radius: 10px; background: #FDECEC; color: #A00F1A; display: flex; align-items: center; font-size: 13px; font-weight: 700">{{t}}</span>
</sc-for>
</div>
<div style="margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Results for “rice”</h2>
<span style="font-size: 13px; color: #5B5B5B">4 dishes</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{results}}" as="it" hint-placeholder-count="4">
<a href="ItemDetail.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; border: 1px solid #ECE7E4; text-decoration: none; color: #1A1A1A">
<span style="width: 68px; height: 68px; border-radius: 14px; background: {{it.bg}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #5B3A2A">[Photo]</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{it.name}}</span>
<span style="font-size: 12px; color: #5B5B5B">{{it.desc}}</span>
<span style="font-size: 14px; font-weight: 800; color: #C1121F">{{it.price}}</span>
</span>
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 11px; background: #C1121F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px">+</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
recent: ['Assorted jollof', 'Water', 'Can drink'],
tags: ['Jollof', 'Fried rice', 'Chicken', 'Beef', 'Fish', 'Assorted', 'Water', 'Cans', 'Glass bottles'],
results: [
{ name: 'Jollof & Chicken', desc: 'Smoky party jollof, grilled chicken', price: 'GH₵ 55.00', bg: '#F9DCCB' },
{ name: 'Fried Rice & Chicken', desc: 'Veggie fried rice, grilled chicken', price: 'GH₵ 55.00', bg: '#F6E5C2' },
{ name: 'Assorted Jollof', desc: 'Chicken, beef, sausage, egg', price: 'GH₵ 70.00', bg: '#F7D5B8' },
{ name: 'Assorted Fried Rice', desc: 'Chicken, beef, sausage, egg', price: 'GH₵ 70.00', bg: '#F3E1D6' }
]
};
}
}
</script>
</body>
</html>
