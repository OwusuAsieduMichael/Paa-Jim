<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paa Jim · Rate your order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#C1121F}a:hover{color:#8E0D17}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #FFFFFF; color: #1A1A1A; overflow: hidden; display: flex; flex-direction: column">
<div style="background: #C1121F; color: #FFFFFF; padding: 64px 24px 40px; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#C1121F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></span>
<h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 800">Enjoy your meal!</h1>
<p style="margin: 0; font-size: 14px; opacity: 0.92">Order #PJ-1042 delivered at 8:43 PM</p>
</div>
<div style="padding: 24px 24px 0; display: flex; flex-direction: column; gap: 22px">
<section style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">How was the food?</h2>
<div style="display: flex; gap: 10px">
<sc-for list="{{food}}" as="s" hint-placeholder-count="5">
<button aria-label="{{s.label}}" onClick="{{s.pick}}" style="width: 48px; height: 48px; border: 0; border-radius: 14px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.6" stroke-linejoin="round"><polygon points="12,3 14.8,9 21,9.5 16.2,13.6 17.8,20 12,16.6 6.2,20 7.8,13.6 3,9.5 9.2,9"/></svg></button>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">What went well?</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<button onClick="{{t.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: {{t.border}}; background: {{t.bg}}; color: {{t.color}}; font-family: inherit; font-size: 13px; font-weight: 700">{{t.name}}</button>
</sc-for>
</div>
</section>
<section style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: #F7F4F2">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #E7DCCB; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #5B3A2A">KA</span>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Rate Kwame, your rider</span><span style="font-size: 12px; color: #5B5B5B">Was he polite and on time?</span></div>
<div style="display: flex; gap: 8px">
<button aria-label="Thumbs down" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5B5B" stroke-width="2" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H6a2 2 0 0 0-2 1.7l-1.4 9A2 2 0 0 0 4.6 15z"/></svg></button>
<button aria-label="Thumbs up" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #C1121F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11a2 2 0 0 0 2-1.7l1.4-9A2 2 0 0 0 19.4 9z"/></svg></button>
</div>
</section>
<label for="comment" style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700">Anything else?
<textarea id="comment" rows="3" placeholder="Tell Paa Jim what you loved or what to fix" style="border-radius: 14px; border: 1.5px solid #ECE7E4; padding: 12px 14px; font-family: inherit; font-size: 14px; font-weight: 400; resize: none; color: #1A1A1A"></textarea>
</label>
</div>
<div style="margin-top: auto; padding: 0 24px 32px; display: flex; flex-direction: column; gap: 8px">
<a href="Orders.dc.html" style="height: 56px; border-radius: 16px; background: #C1121F; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Submit review</a>
<a href="Home.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; text-decoration: none; color: #5B5B5B">Skip</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { stars: 4, tags: { Tasty: true, Hot: true } }; }
renderVals() {
const n = this.state.stars;
const food = [1, 2, 3, 4, 5].map((i) => ({
label: i + ' star' + (i > 1 ? 's' : ''),
bg: i <= n ? '#FFF4D6' : '#F7F4F2', fill: i <= n ? '#F2A900' : 'none', stroke: i <= n ? '#E09A00' : '#B9B2AE',
pick: () => this.setState({ stars: i })
}));
const sel = this.state.tags;
const tags = ['Tasty', 'Hot', 'Good portion', 'Well packed', 'Fast', 'Friendly rider'].map((t) => ({
name: t, bg: sel[t] ? '#FDECEC' : '#FFFFFF', color: sel[t] ? '#A00F1A' : '#1A1A1A', border: sel[t] ? '1.5px solid #C1121F' : '1.5px solid #ECE7E4',
pick: () => this.setState({ tags: { ...sel, [t]: !sel[t] } })
}));
return { food, tags };
}
}
</script>
</body>
</html>
