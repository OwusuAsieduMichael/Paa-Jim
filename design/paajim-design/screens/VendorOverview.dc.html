<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paa Jim Kitchen · Overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#C1121F}a:hover{color:#8E0D17}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #F7F4F2; color: #1A1A1A; overflow: hidden; display: flex; flex-direction: column">
<div style="background: #1A1A1A; color: #FFFFFF; padding: 52px 20px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #C1121F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24h36a18 18 0 0 1-36 0z"/><path d="M16 17c0-3 3-3 3-6M24 17c0-3 3-3 3-6M32 17c0-3 3-3 3-6"/></svg></span>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; opacity: 0.75">Paa Jim’s Kitchen</span><h1 style="margin: 0; font-size: 20px; font-weight: 800">Overview</h1></div>
<span style="height: 30px; padding: 0 12px; border-radius: 15px; background: #1E8E3E; display: flex; align-items: center; font-size: 12px; font-weight: 700">Open</span>
</div>
<div style="display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: #2B2B2B">
<sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
<button onClick="{{r.pick}}" style="flex: 1; height: 38px; border: 0; border-radius: 11px; background: {{r.bg}}; color: {{r.fg}}; font-family: inherit; font-size: 13px; font-weight: 700">{{r.name}}</button>
</sc-for>
</div>
</div>
<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; color: #5B5B5B">{{k.label}}</span>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em">{{k.value}}</span>
<span style="font-size: 11px; font-weight: 700; color: {{k.color}}">{{k.trend}}</span>
</div>
</sc-for>
</div>
<section style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 800">{{chartTitle}}</h2><span style="font-size: 11px; color: #5B5B5B">{{chartNote}}</span></div>
<div role="img" aria-label="{{chartLabel}}" style="height: 96px; display: flex; align-items: flex-end; gap: 5px; border-bottom: 1px solid #ECE7E4">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="13"><span style="flex: 1; height: {{b.h}}; border-radius: 4px 4px 0 0; background: {{b.color}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 10px; color: #5B5B5B"><span>{{axisStart}}</span><span>{{axisMid}}</span><span>{{axisEnd}}</span></div>
</section>
<section style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 800">Top sellers</h2>
<sc-for list="{{top}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 128px; font-size: 12px; font-weight: 600; flex-shrink: 0">{{t.name}}</span>
<span style="flex: 1; height: 8px; border-radius: 4px; background: #F2EEEC"><span style="display: block; width: {{t.w}}; height: 8px; border-radius: 4px; background: {{t.color}}"></span></span>
<span style="width: 26px; text-align: right; font-size: 12px; font-weight: 800">{{t.n}}</span>
</div>
</sc-for>
</section>
<div style="padding: 12px 14px; border-radius: 14px; background: #FFF6E0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5A4300">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A6500" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 21h20z"/><path d="M12 10v4M12 17h.01"/></svg>
<span style="flex: 1"><b>Malt · glass bottle</b> is sold out</span>
<button style="height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 700; color: #5A4300">Back in stock</button>
</div>
</div>
<nav style="height: 82px; border-top: 1px solid #ECE7E4; background: #FFFFFF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding-bottom: 14px; box-sizing: border-box; flex-shrink: 0">
<a href="VendorQueue.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B5B5B; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B5B5B" stroke-width="2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Orders</a>
<a href="VendorOverview.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #C1121F; font-size: 11px; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="#C1121F" stroke="#C1121F" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Overview</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { range: 'Today' }; }
renderVals() {
const r = this.state.range;
const ranges = ['Today', 'This week'].map((n) => ({ name: n, bg: n === r ? '#FFFFFF' : 'transparent', fg: n === r ? '#1A1A1A' : '#D6D0CC', pick: () => this.setState({ range: n }) }));
const day = r === 'Today';
const counts = day ? [1, 3, 5, 4, 2, 1, 2, 3, 4, 6, 8, 9, 6] : [38, 41, 35, 44, 52, 61, 46];
const max = Math.max.apply(null, counts);
const bars = counts.map((n) => ({ h: Math.round(n / max * 86) + 'px', color: n === max ? '#C1121F' : '#F0B7BA' }));
const top = (day
? [['Jollof & Chicken', 14], ['Assorted Jollof', 9], ['Assorted Fried Rice', 8], ['Drinks sold', 31]]
: [['Jollof & Chicken', 92], ['Assorted Jollof', 61], ['Assorted Fried Rice', 55], ['Drinks sold', 204]]);
const topMax = Math.max.apply(null, top.map((t) => t[1]));
return {
ranges, bars,
top: top.map(([name, n], i) => ({ name, n, w: Math.round(n / topMax * 100) + '%', color: i === 3 ? '#1F6FB2' : (i === 2 ? '#E09A00' : '#C1121F') })),
kpis: day ? [
{ label: 'Orders', value: '46', trend: '▲ 12% vs last Mon', color: '#146C2E' },
{ label: 'Sales', value: 'GH₵ 3,280', trend: '▲ 9% vs last Mon', color: '#146C2E' },
{ label: 'Avg cook time', value: '14 min', trend: 'Accept → ready', color: '#5B5B5B' },
{ label: 'Rejected', value: '1', trend: '2.1% · keep under 5%', color: '#5B5B5B' }
] : [
{ label: 'Orders', value: '317', trend: '▲ 6% vs last week', color: '#146C2E' },
{ label: 'Sales', value: 'GH₵ 22,410', trend: '▲ 4% vs last week', color: '#146C2E' },
{ label: 'Avg cook time', value: '15 min', trend: 'Accept → ready', color: '#5B5B5B' },
{ label: 'Rejected', value: '9', trend: '2.8% · keep under 5%', color: '#5B5B5B' }
],
chartTitle: day ? 'Orders by hour' : 'Orders by day',
chartNote: day ? 'Busiest: 9 PM' : 'Busiest: Saturday',
chartLabel: day ? 'Orders per hour today, peaking at 9 PM' : 'Orders per day this week, peaking on Saturday',
axisStart: day ? '10 AM' : 'Mon', axisMid: day ? '4 PM' : 'Thu', axisEnd: day ? '10 PM' : 'Sun'
};
}
}
</script>
</body>
</html>
